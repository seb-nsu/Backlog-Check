name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: |
          coverage run -m pytest
          coverage report

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the reference backlog
        uses: ./
        with:
          file: tests/data/referenz-backlog.json
          config: tests/data/referenz-konfiguration.json
          format: sarif
          output: backlog.sarif
          fail-on: none
          args: --suggest
      - name: Check the SARIF file
        run: python -c "import json; assert json.load(open('backlog.sarif'))['runs'][0]['results']"
